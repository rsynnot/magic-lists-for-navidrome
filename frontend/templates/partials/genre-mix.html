<!-- Genre Mix Content (hidden by default) -->
<div id="genre-mix-content" style="display: none;" class="p-4 pb-6 md:p-8 md:pb-10 bg-white md:border md:border-gray-200 md:rounded-lg">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-3">Genre Mix</h1>
        <p class="text-gray-600">Create a curated mix playlist for a specific genre from your library. Get a diverse selection of tracks that represent the best of that genre.</p>
    </div>

    <form id="genre-mix-form" class="space-y-6">
        <!-- Genre Selection -->
        <div>
            <label for="genre-select" class="block text-sm text-gray-900 font-bold mb-2">Choose a genre from your library</label>
            <div class="relative">
                <select
                    id="genre-select"
                    data-hs-select='{
                        "placeholder": "Search for a genre...",
                        "toggleTag": "<button type=\"button\"></button>",
                        "toggleClasses": "hs-select-disabled:pointer-events-none hs-select-disabled:opacity-50 relative py-3 px-4 pe-9 flex text-nowrap w-full cursor-pointer bg-white border border-gray-200 rounded-lg text-start text-sm focus:border-blue-500 focus:ring-blue-500 before:absolute before:inset-0 before:z-[1]",
                        "dropdownClasses": "hs-select-dropdown mt-2 z-50 w-full max-h-72 p-1 space-y-0.5 bg-white border border-gray-200 rounded-lg overflow-hidden overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-gray-100 [&::-webkit-scrollbar-thumb]:bg-gray-300",
                        "optionClasses": "py-2 px-4 w-full text-sm text-gray-800 cursor-pointer hover:bg-gray-100 rounded-lg focus:outline-none focus:bg-gray-100",
                        "optionTemplate": "<div class=\"flex justify-between items-center w-full\"><span data-title></span><span class=\"hidden hs-selected:block\"><svg class=\"flex-shrink-0 size-3.5 text-blue-600\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg></span></div>",
                        "hasSearch": true,
                        "searchPlaceholder": "Search...",
                        "searchClasses": "block w-full text-sm border-gray-200 rounded-lg focus:border-blue-500 focus:ring-blue-500 before:absolute before:inset-0 before:z-[1] py-2 px-3",
                        "searchWrapperClasses": "bg-white p-2 -mx-1 sticky top-0"
                    }'
                    class="hidden"
                >
                    <option value="">Choose a genre</option>
                </select>
            </div>
        </div>

       <!-- Options Grid -->
       <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
             <!-- Playlist Length -->
             <div>
                 <label class="block text-sm text-gray-900 font-bold mb-3">Playlist Length</label>
                  <ul class="max-w-sm flex flex-col" id="genre-playlist-length-group">
                      <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-blue-100 border border-blue-200 text-blue-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg cursor-pointer">
                          <div class="relative flex items-start w-full">
                              <div class="flex items-center h-5">
                                  <input id="genre-length-25" name="genre-playlist-length" type="radio" value="25" class="border-gray-200 rounded-full disabled:opacity-50" checked>
                              </div>
                              <label for="genre-length-25" class="ms-3 block w-full text-sm text-gray-600">
                                  25 tracks
                              </label>
                          </div>
                      </li>
                      <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-white border border-gray-200 text-gray-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg cursor-pointer">
                          <div class="relative flex items-start w-full">
                              <div class="flex items-center h-5">
                                  <input id="genre-length-50" name="genre-playlist-length" type="radio" value="50" class="border-gray-200 rounded-full disabled:opacity-50">
                              </div>
                              <label for="genre-length-50" class="ms-3 block w-full text-sm text-gray-600">
                                  50 tracks
                              </label>
                          </div>
                      </li>
                      <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-white border border-gray-200 text-gray-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg cursor-pointer">
                          <div class="relative flex items-start w-full">
                              <div class="flex items-center h-5">
                                  <input id="genre-length-100" name="genre-playlist-length" type="radio" value="100" class="border-gray-200 rounded-full disabled:opacity-50">
                              </div>
                              <label for="genre-length-100" class="ms-3 block w-full text-sm text-gray-600">
                                  100 tracks
                              </label>
                          </div>
                      </li>
                 </ul>
             </div>

             <!-- Refresh Frequency -->
             <div class="rediscover-v1-only">
                 <label class="block text-sm text-gray-900 font-bold mb-3">Refresh Frequency</label>
                 <ul class="max-w-sm flex flex-col" id="genre-refresh-frequency-group">
                     <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-blue-100 border border-blue-200 text-blue-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg">
                         <div class="relative flex items-start w-full">
                             <div class="flex items-center h-5">
                                 <input id="genre-freq-none" name="genre-refresh-frequency" type="radio" value="none" class="border-gray-200 rounded-full disabled:opacity-50" checked>
                             </div>
                             <label for="genre-freq-none" class="ms-3 block w-full text-sm text-gray-600">
                                 Don't refresh
                             </label>
                         </div>
                     </li>
                     <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-white border border-gray-200 text-gray-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg">
                         <div class="relative flex items-start w-full">
                             <div class="flex items-center h-5">
                                 <input id="genre-freq-daily" name="genre-refresh-frequency" type="radio" value="daily" class="border-gray-200 rounded-full disabled:opacity-50">
                             </div>
                             <label for="genre-freq-daily" class="ms-3 block w-full text-sm text-gray-600">
                                 Daily <span class="text-xs text-gray-500">(1am)</span>
                             </label>
                         </div>
                     </li>
                     <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-white border border-gray-200 text-gray-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg">
                         <div class="relative flex items-start w-full">
                             <div class="flex items-center h-5">
                                 <input id="genre-freq-weekly" name="genre-refresh-frequency" type="radio" value="weekly" class="border-gray-200 rounded-full disabled:opacity-50">
                             </div>
                             <label for="genre-freq-weekly" class="ms-3 block w-full text-sm text-gray-600">
                                 Weekly <span class="text-xs text-gray-500">(Monday 1am)</span>
                             </label>
                         </div>
                     </li>
                     <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-white border border-gray-200 text-gray-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg">
                         <div class="relative flex items-start w-full">
                             <div class="flex items-center h-5">
                                 <input id="genre-freq-monthly" name="genre-refresh-frequency" type="radio" value="monthly" class="border-gray-200 rounded-full disabled:opacity-50">
                             </div>
                             <label for="genre-freq-monthly" class="ms-3 block w-full text-sm text-gray-600">
                                 Monthly <span class="text-xs text-gray-500">(1st of month 1am)</span>
                             </label>
                         </div>
                     </li>
                 </ul>
             </div>
       </div>
       <!-- Submit Button -->
       <div class="pt-4">
            <button
                type="submit"
                id="create-genre-playlist-btn"
                disabled
                class="w-full md:w-auto bg-gray-900 text-white font-bold py-2 px-4 md:px-6 rounded-lg hover:bg-gray-700 focus:ring-offset-2  transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
            >
               Create Genre Mix Playlist
           </button>
       </div>
    </form>
</div>
