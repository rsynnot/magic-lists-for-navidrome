<!-- Song Radio Content (hidden by default) -->
<div id="song-radio-content" style="display: none;" class="p-4 pb-6 md:p-8 md:pb-10 bg-white md:border md:border-gray-200 md:rounded-lg">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-3">Song Radio</h1>
        <p class="text-gray-600">Choose a starting track to build a playlist of songs with similar audio features from your library.</p>
    </div>

     <form id="song-radio-form" class="space-y-6">
         <!-- Scan Progress Info Box -->
         <div id="song-radio-scan-info" class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4">
             <div class="flex items-center">
                 <div class="flex-shrink-0">
                     <svg class="h-5 w-5 text-blue-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                         <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                     </svg>
                 </div>
                 <div class="ml-3">
                     <p id="song-radio-scan-status" class="text-sm text-blue-800">
                         Loading scan status...
                     </p>
                 </div>
             </div>
         </div>

          <!-- Seed Song Selection -->
          <div>
              <label for="seed-song-search" class="block text-sm text-gray-900 font-bold mb-2">Choose a starting track from your library</label>
              
              <!-- Search Box -->
              <div class="relative max-w-md" id="song-search-container">
                  <div class="relative">
                      <div class="absolute inset-y-0 start-0 flex items-center pointer-events-none z-20 ps-3.5">
                          <svg class="shrink-0 size-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <circle cx="11" cy="11" r="8"></circle>
                              <path d="m21 21-4.3-4.3"></path>
                          </svg>
                      </div>
                      <input 
                          id="seed-song-search"
                          class="py-3 ps-10 pe-10 block w-full border border-gray-300 rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none" 
                          type="text" 
                           placeholder="Search for a track or artist..."
                          autocomplete="off"
                      >
                      <button 
                          type="button"
                          id="clear-track-selection" 
                          class="absolute inset-y-0 end-0 flex items-center z-20 pe-3.5 text-gray-400 hover:text-gray-600 hidden"
                          title="Clear selection"
                      >
                          <svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M18 6 6 18"></path>
                              <path d="m6 6 12 12"></path>
                          </svg>
                      </button>
                  </div>

                  <!-- Search Dropdown -->
                  <div id="song-search-dropdown" class="absolute z-50 w-full bg-white border border-gray-200 rounded-lg mt-1" style="display: none;">
                      <div class="max-h-72 rounded-b-lg overflow-hidden overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-gray-100 [&::-webkit-scrollbar-thumb]:bg-gray-300">
                          <!-- Search results will be populated here -->
                          <div id="song-search-results"></div>
                      </div>
                  </div>
              </div>
              
              <!-- Hidden input to store selected track ID -->
              <input type="hidden" id="selected-seed-track-id" value="">
              
               <p class="text-xs text-gray-500 mt-1">Only tracks that have been analyzed will appear in search results. Run a library scan first if your track isn't found.</p>
          </div>

        <!-- Options Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Playlist Length -->
            <div>
                <label class="block text-sm text-gray-900 font-bold mb-3">Playlist Length</label>
            <ul class="max-w-sm flex flex-col " id="radio-playlist-length-group">
                <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-blue-100 border border-blue-200 text-blue-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg cursor-pointer">
                    <div class="relative flex items-start w-full">
                        <div class="flex items-center h-5">
                            <input id="radio-length-25" name="radio-playlist-length" type="radio" value="25" class="border-gray-200 rounded-full cursor-pointer disabled:opacity-50" checked>
                        </div>
                        <label for="radio-length-25" class="ms-3 block w-full text-sm cursor-pointer text-gray-600">
                            25 tracks
                        </label>
                    </div>
                </li>
                <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-white border border-gray-200 text-gray-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg cursor-pointer ">
                    <div class="relative flex items-start w-full">
                        <div class="flex items-center h-5">
                            <input id="radio-length-50" name="radio-playlist-length" type="radio" value="50" class="border-gray-200 rounded-full cursor-pointer disabled:opacity-50">
                        </div>
                        <label for="radio-length-50" class="ms-3 block w-full text-sm text-gray-600 cursor-pointer">
                            50 tracks
                        </label>
                    </div>
                </li>
                <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-white border border-gray-200 text-gray-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg cursor-pointer">
                    <div class="relative flex items-start w-full">
                        <div class="flex items-center h-5">
                            <input id="radio-length-100" name="radio-playlist-length" type="radio" value="100" class="border-gray-200 rounded-full cursor-pointer disabled:opacity-50">
                        </div>
                        <label for="radio-length-100" class="ms-3 block w-full text-sm text-gray-600 cursor-pointer ">
                            100 tracks
                        </label>
                    </div>
                </li>
            </ul>
        </div>

        <!-- Refresh Frequency -->
        <div>
            <label class="block text-sm text-gray-900 font-bold mb-3">Refresh Frequency</label>
            <ul class="max-w-sm flex flex-col" id="radio-refresh-frequency-group">
                <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-blue-100 border border-blue-200 text-blue-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg">
                    <div class="relative flex items-start w-full">
                        <div class="flex items-center h-5">
                            <input id="radio-freq-none" name="radio-refresh-frequency" type="radio" value="none" class="border-gray-200 rounded-full" checked>
                        </div>
                        <label for="radio-freq-none" class="ms-3 block w-full text-sm text-gray-600">
                            Don't refresh
                        </label>
                    </div>
                </li>
                <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-white border border-gray-200 text-gray-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg">
                    <div class="relative flex items-start w-full">
                        <div class="flex items-center h-5">
                            <input id="radio-freq-daily" name="radio-refresh-frequency" type="radio" value="daily" class="border-gray-200 rounded-full">
                        </div>
                        <label for="radio-freq-daily" class="ms-3 block w-full text-sm text-gray-600">
                            Daily <span class="text-xs text-gray-500">(1am)</span>
                        </label>
                    </div>
                </li>
                <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-white border border-gray-200 text-gray-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg">
                    <div class="relative flex items-start w-full">
                        <div class="flex items-center h-5">
                            <input id="radio-freq-weekly" name="radio-refresh-frequency" type="radio" value="weekly" class="border-gray-200 rounded-full">
                        </div>
                        <label for="radio-freq-weekly" class="ms-3 block w-full text-sm text-gray-600">
                            Weekly <span class="text-xs text-gray-500">(Monday 1am)</span>
                        </label>
                    </div>
                </li>
                <li class="inline-flex items-center gap-x-2 py-3 px-4 text-sm font-medium bg-white border border-gray-200 text-gray-800 -mt-px first:rounded-t-lg first:mt-0 last:rounded-b-lg">
                    <div class="relative flex items-start w-full">
                        <div class="flex items-center h-5">
                            <input id="radio-freq-monthly" name="radio-refresh-frequency" type="radio" value="monthly" class="border-gray-200 rounded-full">
                        </div>
                        <label for="radio-freq-monthly" class="ms-3 block w-full text-sm text-gray-600">
                            Monthly <span class="text-xs text-gray-500">(1st of month 1am)</span>
                        </label>
                    </div>
                </li>
            </ul>
        </div>
          

        <!-- Submit Button -->
        <div class="pt-4">
            <button
                type="submit"
                id="create-radio-playlist-btn"
                class="w-full md:w-auto bg-gray-900 text-white font-bold py-2 px-4 md:px-6 rounded-lg hover:bg-gray-700 focus:ring-offset-2  transition-colors"
            >
                Create Song Radio Playlist
            </button>
        </div>
    </form>
</div>
